services:
  harmonicast:
    image: mjstrong/harmonicast:${HARMONICAST_IMAGE_TAG:-latest}
    container_name: harmonicast
    ports:
      - "${HARMONICAST_PORT:-3001}:3001"
    env_file:
      - ${HARMONICAST_ENV_FILE:-.env}
    environment:
      DATA_DIR: /app/data
      PORT: 3001
    volumes:
      - harmonicast-data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  harmonicast-data:
