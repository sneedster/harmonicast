services:
  resonance:
    image: mjstrong/harmonicast:${RESONANCE_IMAGE_TAG:-latest}
    container_name: resonance
    ports:
      - "${RESONANCE_PORT:-3001}:3001"
    env_file:
      - ${RESONANCE_ENV_FILE:-.env}
    environment:
      DATA_DIR: /app/data
      PORT: 3001
    volumes:
      - resonance-data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  resonance-data:
