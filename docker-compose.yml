services:
  resonance:
    build: .
    ports:
      - "8080:3001"
    volumes:
      - resonance-data:/app/data
    env_file:
      - .env
    environment:
      # Data directory for SQLite database (inside container)
      DATA_DIR: /app/data
      PORT: 3001
    restart: unless-stopped

volumes:
  resonance-data:
