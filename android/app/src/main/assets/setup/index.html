<!doctype html><html lang="en" data-purpose="personal"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect MusicGrabber · Harmonicast</title>
<style>:root{color-scheme:dark;font:17px system-ui;background:#100d18;color:#f1eafa}body{max-width:540px;margin:6vh auto;padding:24px}h1{font-family:Georgia,serif;font-weight:400}label{display:block;margin:18px 0 8px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #675578;border-radius:9px;background:#211b2c;color:inherit;font:inherit}input[type=checkbox]{width:auto}button{padding:13px 20px;margin-top:20px;border:0;border-radius:10px;background:#cbb1ed;color:#251330;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:hover{filter:brightness(1.1)}button:active{filter:brightness(.9)}:focus-visible{outline:3px solid #cbb1ed;outline-offset:3px}summary{cursor:pointer}summary:hover{color:#cbb1ed}:root{scrollbar-color:#857399 #211b2c;scrollbar-width:auto}@media(forced-colors:active){:root{scrollbar-color:auto}}details{margin-top:24px}p{line-height:1.5}#message{min-height:3em;color:#dfc4fa}[hidden]{display:none!important}</style>
<h1 id="heading">Connect MusicGrabber</h1><p id="intro">Enter the pairing code shown in Harmonicast. Keep its setup screen open.</p>
<form id="pair" novalidate><label for="code">Pairing code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off"><button>Pair</button></form>
<form id="connection" hidden novalidate><label for="url">MusicGrabber URL</label><input id="url" type="url" required placeholder="http://musicgrabber:8000" autocomplete="url">
<div id="login"><label for="username">Username</label><input id="username" autocomplete="username"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password"><label><input id="remember" type="checkbox" checked> Remember login on the Android device</label></div>
<details id="advanced"><summary>Advanced settings</summary><label><input id="keymode" type="checkbox"> Use API key instead</label><div id="keyfields" hidden><label for="key">API key</label><input id="key" type="password" autocomplete="off"><p>Leave empty only if the service allows unauthenticated access.</p></div></details><button id="test">Test connection</button></form><p id="message" role="status" aria-live="polite"></p>
<script>(()=>{'use strict';const $=id=>document.getElementById(id);let token='',finished=false;const shared=document.documentElement.dataset.purpose==='shared';if(shared){document.title='Connect shared account · Harmonicast';$('heading').textContent='Connect shared MusicGrabber account';$('intro').textContent='Enter the pairing code from shared account setup in Harmonicast. Use the dedicated non-admin account, not your personal administrator login.';$('url').placeholder='https://musicgrabber.example.com';$('advanced').hidden=true;$('remember').checked=true;$('remember').closest('label').hidden=true;}const clear=()=>{$('password').value='';$('key').value='';$('username').value='';$('url').value='';};
async function api(path,body){const r=await fetch(path,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Setup unavailable');return j;}
$('keymode').onchange=()=>{$('login').hidden=$('keymode').checked;$('keyfields').hidden=!$('keymode').checked;$('password').value='';$('key').value='';};
$('pair').onsubmit=async e=>{e.preventDefault();if(!/^[0-9]{6}$/.test($('code').value)){$('message').textContent='Enter the six-digit code shown in Harmonicast.';$('code').focus();return;}try{const paired=await api('/pair',{code:$('code').value});token=paired.token;if(paired.url)$('url').value=paired.url;$('code').value='';$('pair').hidden=true;$('connection').hidden=false;$('message').textContent=shared?'Enter the HTTPS service address and dedicated non-admin login. Publication happens only after review in Harmonicast.':'Paste your existing service details below.';$('url').focus();}catch(e){$('message').textContent=e.message;}};
$('connection').onsubmit=async e=>{e.preventDefault();if(!$('url').value.trim()||(!$('keymode').checked&&(!$('username').value.trim()||!$('password').value))){$('message').textContent='Enter the service address, username and password.';return;}$('test').disabled=true;$('message').textContent='Testing from the Android device…';try{const j=await api('/validate',{url:$('url').value,username:$('username').value,password:$('password').value,remember:$('remember').checked,apiKeyMode:$('keymode').checked,apiKey:$('key').value});clear();$('connection').hidden=true;$('message').textContent=j.message;}catch(e){$('message').textContent=e.message;}finally{$('test').disabled=false;}};
const timer=setInterval(async()=>{if(!token||finished)return;try{const j=await api('/status',{});if(j.ready)$('message').textContent=j.message;}catch(e){finished=true;token='';clear();$('connection').hidden=true;$('message').textContent='Setup closed. Check Harmonicast for the saved connection or start setup again.';clearInterval(timer);}},2000);
setTimeout(()=>{finished=true;token='';clear();$('connection').hidden=true;$('pair').hidden=true;$('message').textContent='Setup expired. Start again from Harmonicast.';clearInterval(timer);},300000);window.addEventListener('pagehide',()=>{token='';clear();});})();</script></html>
