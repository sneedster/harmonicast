    versionCode: 17
    # Set to the full commit SHA of the v1.0.16 F-Droid release.
    commit: REPLACE_WITH_RELEASE_COMMIT
    subdir: android
    gradle:
      - yes

AutoUpdateMode: None
UpdateCheckMode: None
